<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">

<body class="bg-slate-100 text-dark antialiased flex flex-col min-h-screen">

    <noscript>
        <style>
            #cart-items, #cart-summary { display: none !important; }
        </style>
        <div style="background:#56c142;color:white;text-align:center;padding:12px;font-family:'Plus Jakarta Sans',sans-serif;font-weight:bold;font-size:14px;">
            Vui long bat JavaScript de su dung gio hang truc tuyen. Hoac lien he truc tiep de dat hang.
        </div>
    </noscript>

    <header class="glass-header text-white p-4 sticky top-0 z-50 shadow-sm border-b border-white/10">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold tracking-tighter flex items-center gap-2">
                <span class="bg-white text-primary px-2 py-1 rounded-lg">Nobi</span>nobinobi
            </a>
            <div class="flex items-center gap-4">
                <a href="cart.html" class="bg-white/10 p-2 rounded-full relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span id="cart-count-header" class="absolute -top-1 -right-1 bg-secondary text-[10px] w-4 h-4 rounded-full flex items-center justify-center border border-white font-bold">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        <h1 class="text-3xl font-black text-slate-900 mb-8 uppercase tracking-widest text-center">Giỏ Hàng Của Bạn</h1>
        
        <!-- Noscript: Hiển thị sản phẩm + liên hệ khi tắt JS -->
        <noscript>
            <div class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-6 md:p-8 mb-8">
                <h2 class="text-xl font-bold text-slate-900 mb-6 uppercase">San pham cua Nobinobi</h2>
                <div class="space-y-6">
                    <div class="flex items-center space-x-4 border-b border-slate-50 pb-6">
                        <div class="bg-accent rounded-2xl p-2 h-20 w-20 flex items-center justify-center">
                            <img src="images/7bf617ad-ac24-4d67-8ed3-547466ce2112.jfif" alt="Sukoyaka M1 800g" class="max-h-full object-contain">
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-900 mb-1">Sukoyaka M1 (800g)</h3>
                            <p class="text-primary font-black">550.000d</p>
                            <p class="text-slate-400 text-sm">Cong thuc danh rieng cho be 0-1 tuoi</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4 border-b border-slate-50 pb-6">
                        <div class="bg-accent rounded-2xl p-2 h-20 w-20 flex items-center justify-center">
                            <img src="images/27ae0e3db0340cbd915e9c5aeb8c8f4f.webp" alt="Combo 2 Lon M1" class="max-h-full object-contain">
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-900 mb-1">Combo 2 Lon M1</h3>
                            <p class="text-primary font-black">1.090.000d</p>
                            <p class="text-slate-400 text-sm">Tiet kiem hon, qua tang hoa toc</p>
                        </div>
                    </div>
                    <div class="flex items-center space-x-4">
                        <div class="bg-accent rounded-2xl p-2 h-20 w-20 flex items-center justify-center">
                            <img src="images/75ee42ed78613764e0b4ad76addd9812.webp" alt="Sukoyaka Dang Thanh" class="max-h-full object-contain">
                        </div>
                        <div>
                            <h3 class="text-lg font-bold text-slate-900 mb-1">Sukoyaka Dang Thanh</h3>
                            <p class="text-primary font-black">490.000d</p>
                            <p class="text-slate-400 text-sm">Tien loi mang di du lich</p>
                        </div>
                    </div>
                </div>
            </div>
            <div class="bg-white rounded-[2rem] shadow-xl border border-primary/20 p-8 text-center">
                <h2 class="text-xl font-bold text-slate-900 mb-4 uppercase">Dat hang truc tiep</h2>
                <p class="text-slate-500 mb-6">Lien he Nobinobi de dat hang nhanh nhat:</p>
                <div class="space-y-3">
                    <a href="tel:1900xxxx" class="block bg-primary text-white font-black py-4 rounded-2xl text-lg">Goi: 1900.xxxx (8h - 22h)</a>
                    <a href="https://nobinobi.vn" class="block bg-secondary text-white font-black py-4 rounded-2xl text-lg">Truy cap Nobinobi.vn</a>
                </div>
                <div class="mt-6 text-slate-400 text-sm">
                    <p>48 Duong B4, An Loi Dong, Thu Duc, HCM</p>
                    <p>96 Dao Tri, Phu Thuan, Quan 7, HCM</p>
                </div>
            </div>
        </noscript>

        <div id="cart-items" class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-6 md:p-8 space-y-6">
            </div>

        <div id="cart-summary" class="mt-8 bg-white rounded-[2rem] shadow-xl border border-primary/20 p-8 hidden">
            <h2 class="text-xl font-bold text-slate-900 mb-4 uppercase">Tổng đơn hàng</h2>
            <div class="flex justify-between items-center mb-6 pb-6 border-b border-slate-100">
                <span class="text-slate-500 font-medium">Tạm tính:</span>
                <span id="cart-total" class="text-3xl font-black text-secondary">0đ</span>
            </div>
            <!-- Turnstile inline widget -->
            <div id="turnstile-wrapper" class="flex flex-col items-center gap-4 mt-6">
                <div id="turnstile-widget"></div>
                <div id="verify-status" class="text-center text-sm font-bold hidden"></div>
            </div>

            <button id="btn-checkout" onclick="handleCheckout()" disabled class="w-full bg-slate-300 text-white font-black py-5 rounded-2xl transition shadow-xl active:scale-95 text-lg cursor-not-allowed mt-6">
                TIẾN HÀNH ĐẶT HÀNG
            </button>
        </div>
    </main>

    <footer class="bg-dark text-white pt-12 pb-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 font-bold mb-2 uppercase tracking-[0.3em] text-xs">Nobinobi - Sữa y khoa Nhật Bản</p>
            <p class="text-xs opacity-40">© 2026 Nobinobi. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });

        function getCart() {
            const cart = localStorage.getItem('cart');
            return cart ? JSON.parse(cart) : [];
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function loadCart() {
            const cart = getCart();
            const cartItemsContainer = document.getElementById('cart-items');
            const cartSummary = document.getElementById('cart-summary');
            const cartTotalElement = document.getElementById('cart-total');
            const cartCountHeader = document.getElementById('cart-count-header');
            
            let total = 0;
            let htmlContent = '';

            if (cart.length === 0) {
                // Giữ HTML an toàn thay vì thao tác chèn/xóa node phức tạp
                htmlContent = '<p id="empty-cart-message" class="text-center text-slate-500 font-medium">Giỏ hàng đang trống. Hãy quay lại trang chủ để chọn sản phẩm nhé!</p>';
                cartSummary.style.display = 'none';
            } else {
                cartSummary.style.display = 'block';
                
                cart.forEach(item => {
                    htmlContent += `
                        <div class="flex items-center justify-between border-b border-slate-50 pb-6 last:border-0 last:pb-0">
                            <div class="flex items-center space-x-4">
                                <div class="bg-accent rounded-2xl p-2 h-20 w-20 flex items-center justify-center">
                                    <img src="${item.image}" alt="${item.name}" class="max-h-full object-contain mix-blend-multiply">
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold text-slate-900 mb-1">${item.name}</h3>
                                    <p class="text-primary font-black">${item.price}</p>
                                </div>
                            </div>
                            <button onclick="removeFromCart('${item.id}')" class="bg-red-50 text-red-500 p-3 rounded-xl hover:bg-red-500 hover:text-white transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    `;
                    // Ép kiểu lại giá tiền mỗi khi render
                    total += parseInt(item.price.replace(/[^0-9]/g, ''));
                });
            }
            
            cartItemsContainer.innerHTML = htmlContent;
            cartTotalElement.innerText = `${total.toLocaleString('vi-VN')}đ`;
            cartCountHeader.innerText = cart.length;
        }

        function removeFromCart(id) {
            let cart = getCart();
            cart = cart.filter(item => item.id !== id);
            saveCart(cart);
            loadCart();
        }

        // ===== CLOUDFLARE TURNSTILE (INLINE) =====
        const TURNSTILE_SITE_KEY = '0x4AAAAAAC8omSC6eNvLeFK2';
        let turnstileToken = null;

        function initTurnstile() {
            if (typeof turnstile === 'undefined') return;
            const cart = getCart();
            if (cart.length === 0) return;

            turnstile.render('#turnstile-widget', {
                sitekey: TURNSTILE_SITE_KEY,
                theme: 'light',
                language: 'vi',
                callback: function(token) {
                    turnstileToken = token;
                    sessionStorage.setItem('turnstile_token', token);
                    const btn = document.getElementById('btn-checkout');
                    btn.disabled = false;
                    btn.classList.remove('bg-slate-300', 'cursor-not-allowed');
                    btn.classList.add('bg-primary', 'hover:bg-secondary');
                    document.getElementById('verify-status').innerHTML = '<span class="text-primary">&#10003; Xác thực thành công!</span>';
                    document.getElementById('verify-status').classList.remove('hidden');
                },
                'error-callback': function() {
                    document.getElementById('verify-status').innerHTML = '<span class="text-red-500">Xác thực thất bại. Vui lòng thử lại.</span>';
                    document.getElementById('verify-status').classList.remove('hidden');
                },
                'expired-callback': function() {
                    turnstileToken = null;
                    const btn = document.getElementById('btn-checkout');
                    btn.disabled = true;
                    btn.classList.add('bg-slate-300', 'cursor-not-allowed');
                    btn.classList.remove('bg-primary', 'hover:bg-secondary');
                    document.getElementById('verify-status').innerHTML = '<span class="text-secondary">Hết hạn xác thực. Vui lòng xác minh lại.</span>';
                    document.getElementById('verify-status').classList.remove('hidden');
                },
            });
        }

        function handleCheckout() {
            if (!turnstileToken) return;
            window.location.href = 'https://nobinobi.vn/cart';
        }

        // Chờ Turnstile script load xong rồi render
        const waitTurnstile = setInterval(() => {
            if (typeof turnstile !== 'undefined') {
                clearInterval(waitTurnstile);
                initTurnstile();
            }
        }, 200);
    </script>

    <!-- Load Turnstile ở cuối body để không block render -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
