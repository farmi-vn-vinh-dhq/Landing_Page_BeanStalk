<!DOCTYPE html>
<html lang="vi" class="scroll-smooth">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Giỏ Hàng | Sữa BeanStalk</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&display=swap" rel="stylesheet">
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: { primary: '#56c142', secondary: '#FF8A00', accent: '#F0F9F0', dark: '#1A202C' },
                    fontFamily: { sans: ['Plus Jakarta Sans', 'sans-serif'] },
                }
            }
        }
    </script>
    <style>
        .glass-header { background: rgba(86, 193, 66, 0.95); backdrop-filter: blur(12px); }
        .modal-overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.5); backdrop-filter: blur(4px); z-index: 100; display: flex; align-items: center; justify-content: center; opacity: 0; pointer-events: none; transition: opacity 0.3s; }
        .modal-overlay.active { opacity: 1; pointer-events: auto; }
        .modal-box { background: white; border-radius: 2rem; padding: 2rem; max-width: 480px; width: 90%; transform: scale(0.9); transition: transform 0.3s; box-shadow: 0 25px 50px rgba(0,0,0,0.15); }
        .modal-overlay.active .modal-box { transform: scale(1); }
        .form-input { width: 100%; padding: 0.75rem 1rem; border: 2px solid #e2e8f0; border-radius: 1rem; font-size: 0.95rem; transition: border-color 0.2s; outline: none; font-family: inherit; }
        .form-input:focus { border-color: #56c142; }
        .form-input.error { border-color: #ef4444; }
        .captcha-box { background: #f0f9f0; border: 2px dashed #56c142; border-radius: 1rem; padding: 1.5rem; text-align: center; }
        .step-hidden { display: none; }
        .spinner { display: inline-block; width: 20px; height: 20px; border: 3px solid rgba(255,255,255,0.3); border-radius: 50%; border-top-color: white; animation: spin 0.8s linear infinite; }
        @keyframes spin { to { transform: rotate(360deg); } }
    </style>
</head>
<body class="bg-slate-100 text-dark antialiased flex flex-col min-h-screen">

    <header class="glass-header text-white p-4 sticky top-0 z-50 shadow-sm border-b border-white/10">
        <div class="max-w-7xl mx-auto flex items-center justify-between">
            <a href="index.html" class="text-2xl font-extrabold tracking-tighter flex items-center gap-2">
                <span class="bg-white text-primary px-2 py-1 rounded-lg">Nobi</span>nobinobi
            </a>
            <div class="flex items-center gap-4">
                <a href="cart.html" class="bg-white/10 p-2 rounded-full relative">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" />
                    </svg>
                    <span id="cart-count-header" class="absolute -top-1 -right-1 bg-secondary text-[10px] w-4 h-4 rounded-full flex items-center justify-center border border-white font-bold">0</span>
                </a>
            </div>
        </div>
    </header>

    <main class="max-w-4xl mx-auto px-4 py-12 flex-grow w-full">
        <h1 class="text-3xl font-black text-slate-900 mb-8 uppercase tracking-widest text-center">Giỏ Hàng Của Bạn</h1>
        
        <div id="cart-items" class="bg-white rounded-[2rem] shadow-sm border border-slate-100 p-6 md:p-8 space-y-6">
            </div>

        <div id="cart-summary" class="mt-8 bg-white rounded-[2rem] shadow-xl border border-primary/20 p-8 hidden">
            <h2 class="text-xl font-bold text-slate-900 mb-4 uppercase">Tổng đơn hàng</h2>
            <div class="flex justify-between items-center mb-6 pb-6 border-b border-slate-100">
                <span class="text-slate-500 font-medium">Tạm tính:</span>
                <span id="cart-total" class="text-3xl font-black text-secondary">0đ</span>
            </div>
            <button onclick="openVerifyModal()" class="w-full bg-primary text-white font-black py-5 rounded-2xl hover:bg-secondary transition shadow-xl active:scale-95 text-lg">
                TIẾN HÀNH ĐẶT HÀNG
            </button>
        </div>
    </main>

    <!-- Modal Xác Thực Turnstile -->
    <div id="verify-modal" class="modal-overlay" onclick="if(event.target===this)closeVerifyModal()">
        <div class="modal-box">
            <div class="flex items-center justify-between mb-6">
                <h3 class="text-xl font-black text-slate-900">Xác thực bảo mật</h3>
                <button onclick="closeVerifyModal()" class="text-slate-400 hover:text-slate-600 transition">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-6 w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"/></svg>
                </button>
            </div>
            <p class="text-slate-500 text-sm mb-6">Vui lòng xác nhận bạn không phải robot để tiếp tục đặt hàng.</p>
            <div class="captcha-box mb-6">
                <div id="turnstile-widget"></div>
            </div>
            <div id="verify-status" class="text-center text-sm font-bold hidden"></div>
        </div>
    </div>

    <footer class="bg-dark text-white pt-12 pb-6 mt-auto">
        <div class="max-w-7xl mx-auto px-4 text-center">
            <p class="text-slate-500 font-bold mb-2 uppercase tracking-[0.3em] text-xs">Nobinobi - Sữa y khoa Nhật Bản</p>
            <p class="text-xs opacity-40">© 2026 Nobinobi. All rights reserved.</p>
        </div>
    </footer>

    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadCart();
        });

        function getCart() {
            const cart = localStorage.getItem('cart');
            return cart ? JSON.parse(cart) : [];
        }

        function saveCart(cart) {
            localStorage.setItem('cart', JSON.stringify(cart));
        }

        function loadCart() {
            const cart = getCart();
            const cartItemsContainer = document.getElementById('cart-items');
            const cartSummary = document.getElementById('cart-summary');
            const cartTotalElement = document.getElementById('cart-total');
            const cartCountHeader = document.getElementById('cart-count-header');
            
            let total = 0;
            let htmlContent = '';

            if (cart.length === 0) {
                // Giữ HTML an toàn thay vì thao tác chèn/xóa node phức tạp
                htmlContent = '<p id="empty-cart-message" class="text-center text-slate-500 font-medium">Giỏ hàng đang trống. Hãy quay lại trang chủ để chọn sản phẩm nhé!</p>';
                cartSummary.style.display = 'none';
            } else {
                cartSummary.style.display = 'block';
                
                cart.forEach(item => {
                    htmlContent += `
                        <div class="flex items-center justify-between border-b border-slate-50 pb-6 last:border-0 last:pb-0">
                            <div class="flex items-center space-x-4">
                                <div class="bg-accent rounded-2xl p-2 h-20 w-20 flex items-center justify-center">
                                    <img src="${item.image}" alt="${item.name}" class="max-h-full object-contain mix-blend-multiply">
                                </div>
                                <div>
                                    <h3 class="text-lg font-bold text-slate-900 mb-1">${item.name}</h3>
                                    <p class="text-primary font-black">${item.price}</p>
                                </div>
                            </div>
                            <button onclick="removeFromCart('${item.id}')" class="bg-red-50 text-red-500 p-3 rounded-xl hover:bg-red-500 hover:text-white transition">
                                <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16" />
                                </svg>
                            </button>
                        </div>
                    `;
                    // Ép kiểu lại giá tiền mỗi khi render
                    total += parseInt(item.price.replace(/[^0-9]/g, ''));
                });
            }
            
            cartItemsContainer.innerHTML = htmlContent;
            cartTotalElement.innerText = `${total.toLocaleString('vi-VN')}đ`;
            cartCountHeader.innerText = cart.length;
        }

        function removeFromCart(id) {
            let cart = getCart();
            cart = cart.filter(item => item.id !== id);
            saveCart(cart);
            loadCart();
        }

        // ===== CLOUDFLARE TURNSTILE =====
        const TURNSTILE_SITE_KEY = '0x4AAAAAAC8omSC6eNvLeFK2';
        let turnstileWidgetId = null;
        let turnstileReady = false;

        function openVerifyModal() {
            const modal = document.getElementById('verify-modal');
            const status = document.getElementById('verify-status');
            status.classList.add('hidden');
            modal.classList.add('active');

            const container = document.getElementById('turnstile-widget');
            container.innerHTML = '';

            if (turnstileReady && typeof turnstile !== 'undefined') {
                renderTurnstile();
            } else {
                container.innerHTML = '<p class="text-slate-400 text-sm">Đang tải xác thực...</p>';
                // Chờ script load xong rồi render
                const checkInterval = setInterval(() => {
                    if (typeof turnstile !== 'undefined') {
                        turnstileReady = true;
                        clearInterval(checkInterval);
                        container.innerHTML = '';
                        renderTurnstile();
                    }
                }, 200);
            }
        }

        function renderTurnstile() {
            turnstileWidgetId = turnstile.render('#turnstile-widget', {
                sitekey: TURNSTILE_SITE_KEY,
                theme: 'light',
                language: 'vi',
                callback: onTurnstileSuccess,
                'error-callback': onTurnstileError,
                'expired-callback': onTurnstileExpired,
            });
        }

        function closeVerifyModal() {
            const modal = document.getElementById('verify-modal');
            modal.classList.remove('active');
            if (turnstileWidgetId !== null && typeof turnstile !== 'undefined') {
                turnstile.remove(turnstileWidgetId);
                turnstileWidgetId = null;
            }
        }

        function onTurnstileSuccess(token) {
            const status = document.getElementById('verify-status');
            status.innerHTML = '<span class="text-primary">&#10003; Xác thực thành công! Đang chuyển hướng...</span>';
            status.classList.remove('hidden');

            sessionStorage.setItem('turnstile_token', token);

            setTimeout(() => {
                closeVerifyModal();
                window.location.href = 'https://nobinobi.vn/cart';
            }, 1500);
        }

        function onTurnstileError() {
            const status = document.getElementById('verify-status');
            status.innerHTML = '<span class="text-red-500">Xác thực thất bại. Vui lòng thử lại.</span>';
            status.classList.remove('hidden');
        }

        function onTurnstileExpired() {
            const status = document.getElementById('verify-status');
            status.innerHTML = '<span class="text-secondary">Phiên xác thực hết hạn. Vui lòng thử lại.</span>';
            status.classList.remove('hidden');
            if (turnstileWidgetId !== null) {
                turnstile.reset(turnstileWidgetId);
            }
        }
    </script>

    <!-- Load Turnstile ở cuối body để không block render -->
    <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
</body>
</html>
