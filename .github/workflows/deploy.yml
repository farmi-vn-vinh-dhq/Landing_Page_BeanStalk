name: Tự động Deploy Landing Page AI lên Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tải source code về server
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i src/input.css -o public/styles.css --minify

      # Cấu hình file firebase.json để chỉ định SITE
      - name: Cấu hình Site Firebase
        run: |
          cat <<EOF > firebase.json
          {
            "hosting": {
              "site": "mkt-landingpage-ai",
              "public": "public",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ]
            }
          }
          EOF

      # Dùng lệnh CLI trực tiếp để log hiện link CHUẨN
      - name: Deploy lên Firebase Hosting
        run: |
          # Tạo file JSON tạm từ Secret
          echo '${{ secrets.FIREBASE_SA }}' > sa.json
          export GOOGLE_APPLICATION_CREDENTIALS=$PWD/sa.json
          
          # Chạy lệnh deploy trực tiếp
          npx firebase-tools deploy --only hosting:mkt-landingpage-ai --project farmi-go --non-interactive
          
          # Xóa file key sau khi xong
          rm sa.json
