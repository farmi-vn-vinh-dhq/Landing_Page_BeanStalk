name: Tự động Deploy Landing Page AI lên Firebase

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Tải source code về server
        uses: actions/checkout@v4

      - name: Cài đặt Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Cài đặt dependencies
        run: npm ci

      - name: Build Tailwind CSS
        run: npx @tailwindcss/cli -i src/input.css -o public/styles.css --minify

      # Bước này giúp đảm bảo 100% code vào đúng site AI và link báo cáo sẽ chuẩn
      - name: Cấu hình Site Firebase
        run: |
          cat <<EOF > firebase.json
          {
            "hosting": {
              "site": "mkt-landingpage-ai",
              "public": "public",
              "ignore": [
                "firebase.json",
                "**/.*",
                "**/node_modules/**"
              ]
            }
          }
          EOF

      - name: Deploy lên Firebase Hosting
        uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SA }}'
          projectId: farmi-go
          channelId: live
